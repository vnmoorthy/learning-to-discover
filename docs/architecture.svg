<text x="800" y="452" fill="#4FD1E0" font-size="13" text-anchor="middle" font-weight="700" letter-spacing="2">THE LOOP</text>
<text x="800" y="484" fill="#E8EDF2" font-size="19" text-anchor="middle" font-weight="650">one cycle every 180 s</text>
<text x="800" y="514" fill="#8B96A5" font-size="14" text-anchor="middle" >every step is one ledger row:</text>
<text x="800" y="536" fill="#8B96A5" font-size="14" text-anchor="middle" >rationale, prediction, outcome,</text>
<text x="800" y="558" fill="#8B96A5" font-size="14" text-anchor="middle" >sources, memory reads</text>
<text x="800" y="590" fill="#5E6876" font-size="12.5" text-anchor="middle" >a failed cycle is logged, never fatal</text>
<path d="M634 319 L634 226" fill="none" stroke="#E8B65C" stroke-width="1.8" marker-end="url(#aa)"/>
<text x="622" y="268" fill="#E8B65C" font-size="13" text-anchor="end" >launch / stop</text>
<text x="622" y="285" fill="#8B96A5" font-size="12" text-anchor="end" >validated commands only</text>
<path d="M800 220 L800 244" fill="none" stroke="#E8B65C" stroke-width="1.8" marker-end="url(#aa)"/>
<text x="814" y="240" fill="#E8B65C" font-size="13" text-anchor="start" >logs, metrics, FOUND_*.json</text>
<g><rect x="1210" y="292" width="320" height="104" rx="12" fill="#0D1118" stroke="#222B38"/><rect x="1210" y="306" width="4" height="76" rx="2" fill="#4FD1E0"/><text x="1230" y="319" fill="#4FD1E0" font-size="12" font-weight="700" letter-spacing="1.2">EINSTEINARENA</text><text x="1230" y="342" fill="#E8EDF2" font-size="18" font-weight="650">Official verifiers</text>
<text x="1230" y="363" fill="#8B96A5" font-size="13.5">exact integer checks, in a subprocess</text>
<text x="1230" y="381" fill="#8B96A5" font-size="13.5">a record counts only if evaluate() beats it</text>
</g>
<g><rect x="1210" y="458" width="320" height="104" rx="12" fill="#0D1118" stroke="#222B38"/><rect x="1210" y="472" width="4" height="76" rx="2" fill="#4FD1E0"/><text x="1230" y="485" fill="#4FD1E0" font-size="12" font-weight="700" letter-spacing="1.2">PAST.DEV</text><text x="1230" y="508" fill="#E8EDF2" font-size="18" font-weight="650">Shared multi-agent memory</text>
<text x="1230" y="529" fill="#8B96A5" font-size="13.5">one identity; every agent writes + recalls</text>
<text x="1230" y="547" fill="#8B96A5" font-size="13.5">benchmarked against markdown and RAG</text>
</g>
<g><rect x="1210" y="624" width="320" height="104" rx="12" fill="#0D1118" stroke="#222B38"/><rect x="1210" y="638" width="4" height="76" rx="2" fill="#4FD1E0"/><text x="1230" y="651" fill="#4FD1E0" font-size="12" font-weight="700" letter-spacing="1.2">EXA</text><text x="1230" y="674" fill="#E8EDF2" font-size="18" font-weight="650">Literature search</text>
<text x="1230" y="695" fill="#8B96A5" font-size="13.5">queries written for stalled problems</text>
<text x="1230" y="713" fill="#8B96A5" font-size="13.5">source cards cited by decisions</text>
</g>
<g><rect x="1210" y="790" width="320" height="104" rx="12" fill="#0D1118" stroke="#222B38"/><rect x="1210" y="804" width="4" height="76" rx="2" fill="#4FD1E0"/><text x="1230" y="817" fill="#4FD1E0" font-size="12" font-weight="700" letter-spacing="1.2">TINKER</text><text x="1230" y="840" fill="#E8EDF2" font-size="18" font-weight="650">Self-improvement</text>
<text x="1230" y="861" fill="#8B96A5" font-size="13.5">RL (GRPO-style) LoRA on Qwen3-8B</text>
<text x="1230" y="879" fill="#8B96A5" font-size="13.5">learns to write valid constructions</text>
</g>
