<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Phoenixastar: architecture</title>
<desc id="d">An eight-phase autonomous loop (telemetry, critic, memory, literature, propose, referee, plan, execute) in the centre, surrounded by the compute and services it uses: a Lambda GPU box, a Modal CPU fleet, Modal sandboxes, official EinsteinArena verifiers, past.dev memory, Exa search, OpenAI GPT-6 Astra, Claude Fable 5.2, Devin, Tinker and the decision ledger.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#10151C" stroke-width="1"/></pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4FD1E0" stop-opacity="0.10"/><stop offset="1" stop-color="#4FD1E0" stop-opacity="0"/></radialGradient>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4FD1E0"/></marker>
