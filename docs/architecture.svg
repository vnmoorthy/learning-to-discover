<text x="480" y="666" fill="#8B96A5" font-size="13" text-anchor="middle" >approve / veto / amend</text>
<path d="M688 722 L396 818" fill="none" stroke="#8B96A5" stroke-width="1.8" marker-end="url(#am)" stroke-dasharray="6 6"/>
<text x="404" y="752" fill="#8B96A5" font-size="13" text-anchor="start" >every phase logs a decision</text>
<g><rect x="640" y="836" width="320" height="104" rx="12" fill="#0D1118" stroke="#222B38"/><rect x="640" y="850" width="4" height="76" rx="2" fill="#4FD1E0"/><text x="660" y="863" fill="#4FD1E0" font-size="12" font-weight="700" letter-spacing="1.2">OPENAI GPT-6 ASTRA</text><text x="660" y="886" fill="#E8EDF2" font-size="18" font-weight="650">Proposer</text>
<text x="660" y="907" fill="#8B96A5" font-size="13.5">one Responses API call per cycle</text>
<text x="660" y="925" fill="#8B96A5" font-size="13.5">strict JSON: actions + predictions</text>
</g>
<path d="M800 770 L800 830" fill="none" stroke="#4FD1E0" stroke-width="1.8" marker-end="url(#ac)" marker-start="url(#ac)"/>
<text x="814" y="797" fill="#8B96A5" font-size="13" text-anchor="start" >lab state in,</text>
<text x="814" y="814" fill="#8B96A5" font-size="13" text-anchor="start" >decisions out</text>
<text x="800" y="978" fill="#5E6876" font-size="13" text-anchor="middle" >Solid cyan: called inside the cycle.  Amber: compute.  Dashed: side loops and logging.  Every solution is re-checked by the official verifier before it is counted.</text>
</svg>
