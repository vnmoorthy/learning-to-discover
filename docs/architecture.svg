<g><rect x="567.8" y="651.2" width="132" height="50" rx="25" fill="#0A1A20" stroke="#4FD1E0" stroke-width="1.6"/><circle cx="589.8" cy="676.2" r="11" fill="#4FD1E0"/><text x="589.8" y="680.7" fill="#0B0D10" font-size="12.5" font-weight="700" text-anchor="middle">6</text><text x="645.8" y="681.7" fill="#E8EDF2" font-size="16.5" font-weight="600" text-anchor="middle">referee</text></g>
