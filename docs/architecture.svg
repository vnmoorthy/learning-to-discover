<text x="90" y="363" fill="#8B96A5" font-size="13.5">writes new search strategies to a spec</text>
<text x="90" y="381" fill="#8B96A5" font-size="13.5">smoke-tested in a Modal sandbox</text>
</g>
<g><rect x="70" y="458" width="320" height="104" rx="12" fill="#0D1118" stroke="#222B38"/><rect x="70" y="472" width="4" height="76" rx="2" fill="#4FD1E0"/><text x="90" y="485" fill="#4FD1E0" font-size="12" font-weight="700" letter-spacing="1.2">SEARCH/</text><text x="90" y="508" fill="#E8EDF2" font-size="18" font-weight="650">Strategy templates</text>
<text x="90" y="529" fill="#8B96A5" font-size="13.5">search/TEMPLATES.json</text>
<text x="90" y="547" fill="#8B96A5" font-size="13.5">typed, range-checked parameters</text>
</g>
<g><rect x="70" y="624" width="320" height="104" rx="12" fill="#0D1118" stroke="#222B38"/><rect x="70" y="638" width="4" height="76" rx="2" fill="#4FD1E0"/><text x="90" y="651" fill="#4FD1E0" font-size="12" font-weight="700" letter-spacing="1.2">CLAUDE FABLE 5.2</text><text x="90" y="674" fill="#E8EDF2" font-size="18" font-weight="650">Referee</text>
<text x="90" y="695" fill="#8B96A5" font-size="13.5">a second lab's model reviews proposals:</text>
<text x="90" y="713" fill="#8B96A5" font-size="13.5">approve, veto or amend; abstains on failure</text>
</g>
